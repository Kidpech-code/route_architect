name: route_architect
description: >
  Enterprise-grade Flutter routing built on go_router.
  Provides an async guard pipeline, deep-link safety, stateful shell with
  double-tap-to-root, analytics observers, and a zero-friction declarative API.
  100% pure Dart – no native code.
version: 1.0.0
homepage: https://github.com/Kidpech-code/route_architect
repository: https://github.com/Kidpech-code/route_architect
issue_tracker: https://github.com/Kidpech-code/route_architect/issues

topics:
  - routing
  - navigation
  - go-router
  - guards
  - bottom-navigation

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
